<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bursa Market Control Center - Dashboard</title>
    <!-- Library TradingView Lightweight Charts -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <!-- Library SheetJS untuk membaca file Excel/CSV di browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #d1d4dc;
            --border-color: #333333;
            --accent-color: #26a69a;
            --input-bg: #2b2b2b;
        }

        /* Tema Bloomberg Terminal */
        body.theme-bloomberg {
            --bg-color: #000000;
            --card-bg: #0d0d0d;
            --text-color: #ffb100; /* Amber khas Bloomberg */
            --border-color: #332200;
            --accent-color: #ff8800;
            --input-bg: #1a1100;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        .card {
            background-color: var(--card-bg);
            padding: 15px 20px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
        }
        h2 {
            margin: 0 0 15px 0;
            font-size: 22px;
            color: var(--text-color);
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        input[type="file"], select {
            background-color: var(--input-bg);
            color: var(--text-color);
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        #chart-container {
            width: 100%;
            height: 520px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--card-bg);
        }
        .status-text {
            font-size: 12px;
            opacity: 0.7;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>MCC Market Control Center - Dashboard</h2>
        
        <!-- Panel Kontrol & Pengaturan -->
        <div class="card">
            <!-- Upload File -->
            <div class="control-group">
                <label for="file-uploader" style="font-weight: bold;">Upload File (.xls/.csv):</label>
                <input type="file" id="file-uploader" accept=".xls, .xlsx, .csv">
            </div>

            <!-- Pilih Kontrak -->
            <div class="control-group">
                <label for="instrument-select">Kontrak:</label>
                <select id="instrument-select" disabled>
                    <option value="">-- Upload file dulu --</option>
                </select>
            </div>

            <!-- Pilih Periode / Timeframe -->
            <div class="control-group">
                <label for="period-select">Periode:</label>
                <select id="period-select">
                    <option value="60">1 Menit</option>
                    <option value="300" selected>5 Menit</option>
                    <option value="900">15 Menit</option>
                    <option value="3600">1 Jam</option>
                    <option value="86400">1 Hari (1D)</option>
                </select>
            </div>

            <!-- Pilih Tipe Chart -->
            <div class="control-group">
                <label for="chart-type-select">Tipe Chart:</label>
                <select id="chart-type-select">
                    <option value="candlestick" selected>Candlestick</option>
                    <option value="line">Line (Garis)</option>
                    <option value="area">Area</option>
                    <option value="bar">Bar (OHLC)</option>
                </select>
            </div>

            <!-- Pilih Tema (Bloomberg vs Standar) -->
            <div class="control-group">
                <label for="theme-select">Tema:</label>
                <select id="theme-select">
                    <option value="standard">Standard Dark</option>
                    <option value="bloomberg">Bloomberg Terminal</option>
                </select>
            </div>

            <div id="status-info" class="status-text">Status: Silakan *upload* file laporan transaksi bursa Anda.</div>
        </div>

        <!-- Area Grafik -->
        <div id="chart-container"></div>
    </div>

    <script>
        let globalTradesData = [];
        let currentSeries = null;

        // 1. Inisialisasi Chart TradingView Lightweight Charts
        const chartContainer = document.getElementById('chart-container');
        let chart = LightweightCharts.createChart(chartContainer, {
            layout: {
                background: { color: '#1e1e1e' },
                textColor: '#d1d4dc',
            },
            grid: {
                vertLines: { color: '#333333' },
                horzLines: { color: '#333333' },
            },
            timeScale: {
                borderColor: '#484848',
                timeVisible: true,
            },
        });

        function setChartSeries(type, theme) {
            if (currentSeries) {
                chart.removeSeries(currentSeries);
            }

            const isBloomberg = (theme === 'bloomberg');
            let upCol = isBloomberg ? '#ff8800' : '#26a69a';
            let downCol = isBloomberg ? '#555555' : '#ef5350';

            if (type === 'candlestick') {
                currentSeries = chart.addCandlestickSeries({
                    upColor: upCol, downColor: downCol,
                    borderVisible: false,
                    wickUpColor: upCol, wickDownColor: downCol
                });
            } else if (type === 'line') {
                currentSeries = chart.addLineSeries({
                    color: upCol, lineWidth: 2
                });
            } else if (type === 'area') {
                currentSeries = chart.addAreaSeries({
                    topColor: isBloomberg ? 'rgba(255,136,0,0.5)' : 'rgba(38,166,154,0.5)',
                    bottomColor: isBloomberg ? 'rgba(255,136,0,0.0)' : 'rgba(38,166,154,0.0)',
                    lineColor: upCol, lineWidth: 2
                });
            } else if (type === 'bar') {
                currentSeries = chart.addBarSeries({
                    upColor: upCol, downColor: downCol,
                });
            }
        }

        // Set default series awal
        setChartSeries('candlestick', 'standard');

        // 2. Upload & Baca File Excel/CSV
        const fileUploader = document.getElementById('file-uploader');
        const instrumentSelect = document.getElementById('instrument-select');
        const periodSelect = document.getElementById('period-select');
        const chartTypeSelect = document.getElementById('chart-type-select');
        const themeSelect = document.getElementById('theme-select');
        const statusInfo = document.getElementById('status-info');

        fileUploader.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            statusInfo.innerText = `Membaca file ${file.name}...`;
            const reader = new FileReader();

            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet);
                    
                    if (jsonData.length === 0) {
                        alert("File kosong!");
                        return;
                    }

                    globalTradesData = jsonData;
                    processLoadedData(jsonData);
                    statusInfo.innerText = `Berhasil memuat ${jsonData.length} baris data dari ${file.name}.`;
                } catch (err) {
                    console.error(err);
                    alert("Gagal membaca file. Pastikan format kolom sesuai.");
                    statusInfo.innerText = "Gagal memproses file.";
                }
            };
            reader.readAsArrayBuffer(file);
        });

        function processLoadedData(data) {
            const validTrades = data.filter(row => row['B/S'] === 'B' || row['B/S'] === 'b');
            const instruments = [...new Set(validTrades.map(row => row['Instrument Id']))].sort();

            instrumentSelect.innerHTML = '';
            if (instruments.length === 0) {
                instrumentSelect.innerHTML = '<option value="">Tidak ada instrumen</option>';
                instrumentSelect.disabled = true;
                return;
            }

            instruments.forEach(inst => {
                const opt = document.createElement('option');
                opt.value = inst;
                opt.innerText = inst;
                instrumentSelect.appendChild(opt);
            });

            instrumentSelect.disabled = false;
            updateChart();
        }

        // 3. Render / Update Grafik Berdasarkan Pilihan
        function updateChart() {
            const selectedInst = instrumentSelect.value;
            if (!selectedInst || globalTradesData.length === 0) return;

            const interval = parseInt(periodSelect.value); // dalam detik
            const chartType = chartTypeSelect.value;
            const theme = themeSelect.value;

            const validTrades = globalTradesData.filter(row => row['B/S'] === 'B' || row['B/S'] === 'b');
            const instTrades = validTrades.filter(row => row['Instrument Id'] === selectedInst);

            let parsedRows = instTrades.map(row => {
                let dateStr = String(row['Trade Date'] || '');
                let timeStr = String(row['Trade Time'] || '');
                let dt = new Date(`${dateStr.slice(0,4)}-${dateStr.slice(4,6)}-${dateStr.slice(6,8)}T${timeStr}`);
                return {
                    timestamp: Math.floor(dt.getTime() / 1000),
                    price: parseFloat(row['Price']),
                    volume: parseInt(row['Volume'] || 1)
                };
            }).filter(row => !isNaN(row.timestamp) && !isNaN(row.price));

            parsedRows.sort((a, b) => a.timestamp - b.timestamp);

            if (parsedRows.length === 0) return;

            // Resampling berdasarkan interval waktu yang dipilih
            let candlesMap = {};
            parsedRows.forEach(row => {
                let bucketTime = Math.floor(row.timestamp / interval) * interval;
                if (!candlesMap[bucketTime]) {
                    candlesMap[bucketTime] = {
                        time: bucketTime,
                        open: row.price,
                        high: row.price,
                        low: row.price,
                        close: row.price,
                        value: row.price // Untuk line/area chart
                    };
                } else {
                    let c = candlesMap[bucketTime];
                    c.high = Math.max(c.high, row.price);
                    c.low = Math.min(c.low, row.price);
                    c.close = row.price;
                    c.value = row.price;
                }
            });

            let finalData = Object.values(candlesMap).sort((a, b) => a.time - b.time);

            setChartSeries(chartType, theme);
            currentSeries.setData(finalData);
            chart.timeScale().fitContent();
        }

        // 4. Event Listeners untuk semua menu kontrol
        instrumentSelect.addEventListener('change', updateChart);
        periodSelect.addEventListener('change', updateChart);
        chartTypeSelect.addEventListener('change', updateChart);

        themeSelect.addEventListener('change', function(e) {
            const theme = e.target.value;
            if (theme === 'bloomberg') {
                document.body.classList.add('theme-bloomberg');
                chart.applyOptions({
                    layout: { background: { color: '#0d0d0d' }, textColor: '#ffb100' },
                    grid: { vertLines: { color: '#221100' }, horzLines: { color: '#221100' } }
                });
            } else {
                document.body.classList.remove('theme-bloomberg');
                chart.applyOptions({
                    layout: { background: { color: '#1e1e1e' }, textColor: '#d1d4dc' },
                    grid: { vertLines: { color: '#333333' }, horzLines: { color: '#333333' } }
                });
            }
            updateChart();
        });

        window.addEventListener('resize', () => {
            chart.applyOptions({ width: chartContainer.clientWidth });
        });
    </script>

</body>
</html>
